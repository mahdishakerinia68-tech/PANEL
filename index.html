<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIX VIP PANEL</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">M</div><h1>STRIX VIP PANEL</h1><p>ورود به پنل</p><select id="loginRole"><option value="admin">مدیر اصلی</option><option value="customer">مشتری پنل</option></select><input id="loginUser" placeholder="نام کاربری"><input id="loginPass" type="password" placeholder="رمز عبور"><button class="primary" onclick="login()">ورود</button><small>دموی اولیه: مدیر / admin — مشتری / customer</small></div></div>
