<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRIX VIP PANEL | V1.2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="setup" class="hidden">
  <div class="login">
    <div class="loginbox">
      <div class="logo-row"><div class="logo">M</div><span class="version-badge">V1.2</span></div>
      <h1>STRIX VIP PANEL</h1>
      <p>ساخت اولین ادمین</p>
      <label class="field-label">آیدی ادمین</label>
      <input id="setupUser" autocomplete="username" minlength="3" placeholder="حداقل ۳ کاراکتر">
      <label class="field-label">رمز ادمین</label>
      <input id="setupPass" type="password" autocomplete="new-password" minlength="8" placeholder="حداقل ۸ کاراکتر">
      <label class="field-label">تکرار رمز ادمین</label>
      <input id="setupPass2" type="password" autocomplete="new-password" minlength="8" placeholder="رمز را دوباره وارد کنید">
      <div id="setupError" class="form-error hidden" role="alert"></div>
      <button class="primary" onclick="createFirstAdmin()">ساخت ادمین و ورود به پنل</button>
    </div>
  </div>
</div>

<div id="login" class="login hidden">
  <div class="loginbox">
    <div class="logo-row"><div class="logo">M</div><span class="version-badge">V1.2</span></div>
    <h1>STRIX VIP PANEL</h1>
    <p>ورود به پنل</p>
    <select id="loginRole"><option value="admin">مدیر اصلی</option><option value="customer">مشتری پنل</option></select>
    <input id="loginUser" autocomplete="username" placeholder="Username">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button class="primary" onclick="login()">ورود</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo-row"><div class="logo">M</div><span class="version-badge">V1.2</span></div>
      <div><b>STRIX VIP PANEL</b><small id="roleText">مدیر اصلی</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="admin"><span class="avatar" id="avatar">A</span><div><b id="who">مدیر اصلی</b><small id="whoSub">Administrator</small></div></div>
    <button class="logout" onclick="logout()">خروج</button>
  </aside>
  <main>
    <header><button id="menu">☰</button><div><h1 id="title">داشبورد</h1><p id="sub">نمای کلی پنل</p></div><button id="theme">☾</button></header>
    <div id="content"></div>
  </main>
</div>

<div id="modal" class="modal">
  <div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="primary" id="modalSave">ذخیره</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
